<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPay</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>MiniPay</h1>
        <p class="subtitle">Simple Digital Wallet</p>

        <!-- Login Section -->
        <div id="login-section" class="card">
            <h2>Login</h2>

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button onclick="login()">Login</button>

            <p id="login-message"></p>
        </div>


        <!-- Dashboard Section -->
        <div id="dashboard-section" class="card hidden">

            <h2>Welcome, <span id="user-name"></span></h2>

            <div class="balance-box">
                <p>Wallet Balance</p>
                <h1>₹<span id="balance">0.00</span></h1>
            </div>

            <button onclick="loadWallet()">Refresh Balance</button>

            <hr>

            <h3>Add Money</h3>

            <input
                type="number"
                id="add-money"
                placeholder="Amount in ₹"
                min="1"
            >

            <button onclick="addMoney()">Add Money</button>

            <p id="money-message"></p>

            <hr>

            <h3>Transfer Money</h3>

            <input
                type="number"
                id="receiver-id"
                placeholder="Receiver User ID"
                min="1"
            >

            <input
                type="number"
                id="transfer-amount"
                placeholder="Amount in ₹"
                min="1"
                step="0.01"
            >

            <button onclick="transferMoney()">Transfer</button>

            <p id="transfer-message"></p>

            <hr>

            <h3>Transactions</h3>

            <button onclick="loadTransactions()">
                View Transactions
            </button>

            <div id="transactions"></div>

            <hr>

            <button class="logout-button" onclick="logout()">
                Logout
            </button>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
